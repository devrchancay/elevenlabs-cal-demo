server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints asset filenames, so they can be cached forever.
    # `expires` would emit a second, conflicting Cache-Control, so the header is
    # set once by hand instead.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, otherwise a deploy leaves visitors
    # pointing at asset filenames that no longer exist.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
